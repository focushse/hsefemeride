<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#061519">
  <meta name="description" content="Archivo HSE: una historia diaria basada en accidentes reales para aprender y prevenir.">
  <title>Archivo HSE | Historia diaria</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg: #051014;
      --panel: #081b20;
      --panel-2: #0b242a;
      --ink: #f5fbff;
      --muted: #9fb8c0;
      --line: rgba(151, 231, 255, 0.16);
      --cyan: #19d3e6;
      --cyan-soft: rgba(25, 211, 230, 0.12);
      --yellow: #ffd447;
      --danger: #ff4d38;
      --shadow: 0 22px 70px rgba(0, 0, 0, 0.34);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background:
        linear-gradient(180deg, rgba(255, 77, 56, 0.11), transparent 230px),
        radial-gradient(circle at 20% 0%, rgba(25, 211, 230, 0.14), transparent 310px),
        linear-gradient(180deg, #07191d 0%, #041014 58%, #030b0d 100%);
      letter-spacing: 0;
    }

    button {
      font: inherit;
    }

    .page {
      width: min(100%, 940px);
      margin: 0 auto;
      padding: 18px 16px 30px;
    }

    .topbar {
      display: grid;
      place-items: center;
      gap: 7px;
      padding: 8px 0 18px;
      text-align: center;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: fit-content;
      max-width: min(280px, 82vw);
      padding: 9px 20px;
      background: #ffffff;
      border-radius: 14px;
      border: 1px solid rgba(25, 211, 230, 0.35);
      box-shadow: 
        0 10px 28px rgba(0, 0, 0, 0.45),
        0 0 24px rgba(25, 211, 230, 0.16);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .logo:hover {
      transform: translateY(-2px);
      box-shadow: 
        0 14px 34px rgba(0, 0, 0, 0.55),
        0 0 30px rgba(25, 211, 230, 0.26);
    }

    .logo img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 64px;
      object-fit: contain;
    }

    .brand-kicker {
      color: var(--cyan);
      font-size: 0.73rem;
      font-weight: 800;
      letter-spacing: 0.22em;
    }

    .top-nav {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 4px;
    }

    .top-nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 16px;
      border-radius: 20px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.05);
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 800;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .top-nav-btn:hover,
    .top-nav-btn.active {
      background: var(--cyan-soft);
      border-color: var(--cyan);
      color: var(--cyan);
      box-shadow: 0 0 16px rgba(25, 211, 230, 0.2);
    }

    .hero {
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(8, 27, 32, 0.94), rgba(5, 16, 20, 0.98));
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .story-head {
      padding: 22px 18px 18px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .date-chip,
    .file-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 32px;
      padding: 7px 10px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.035);
    }

    .date-chip {
      color: #061014;
      background: var(--cyan);
      border-color: rgba(25, 211, 230, 0.9);
    }

    h1 {
      max-width: 820px;
      margin: 0;
      font-size: clamp(2.35rem, 12vw, 5.8rem);
      line-height: 0.88;
      text-transform: uppercase;
      font-weight: 950;
      letter-spacing: 0;
      text-wrap: balance;
    }

    .highlight {
      color: var(--yellow);
      text-shadow: 0 0 26px rgba(255, 212, 71, 0.22);
    }

    .subtitle {
      max-width: 640px;
      margin: 14px 0 0;
      color: #c4d7dc;
      font-size: 1.02rem;
      line-height: 1.55;
    }

    .cover {
      position: relative;
      min-height: 245px;
      display: grid;
      align-items: end;
      overflow: hidden;
      background:
        linear-gradient(150deg, rgba(5, 16, 20, 0.16), rgba(5, 16, 20, 0.88)),
        var(--cover-image, linear-gradient(135deg, #111 0%, #193940 45%, #060d10 100%));
    }

    .cover::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(25, 211, 230, 0.13) 1px, transparent 1px),
        linear-gradient(0deg, rgba(255, 255, 255, 0.06) 1px, transparent 1px);
      background-size: 44px 44px;
      opacity: 0.22;
    }

    .cover::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      height: 46%;
      background: linear-gradient(180deg, transparent, rgba(5, 16, 20, 0.92));
    }

    .cover-label {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 18px;
      color: var(--ink);
      font-size: 0.82rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .content {
      display: grid;
      gap: 18px;
      padding: 18px;
    }

    .audio-box {
      display: grid;
      gap: 14px;
      padding: 16px;
      border: 1px solid rgba(25, 211, 230, 0.28);
      background: linear-gradient(135deg, rgba(25, 211, 230, 0.12), rgba(255, 77, 56, 0.06));
      border-radius: var(--radius);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .audio-main-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .listen-btn,
    .nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 48px;
      border: 0;
      border-radius: var(--radius);
      cursor: pointer;
      font-weight: 900;
      letter-spacing: 0;
      transition: transform 160ms ease, filter 160ms ease;
    }

    .listen-btn {
      flex: 1 1 auto;
      min-width: 200px;
      padding: 13px 18px;
      background: var(--danger);
      color: #fff;
      text-transform: uppercase;
      box-shadow: 0 12px 32px rgba(255, 77, 56, 0.22);
    }

    .listen-btn.playing {
      background: #e63925;
      box-shadow: 0 0 20px rgba(255, 77, 56, 0.4);
    }

    .listen-btn:hover,
    .nav-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.05);
    }

    .audio-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .audio-ctrl-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.06);
      color: var(--ink);
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 800;
      transition: all 160ms ease;
    }

    .audio-ctrl-btn:hover {
      background: var(--cyan-soft);
      border-color: var(--cyan);
      color: var(--cyan);
      transform: translateY(-1px);
    }

    .speed-btn {
      width: auto;
      min-width: 50px;
      padding: 0 10px;
      font-family: monospace;
      font-size: 0.85rem;
      color: var(--cyan);
      border-color: rgba(25, 211, 230, 0.3);
    }

    .audio-time-row {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
    }

    .time-display {
      font-size: 0.82rem;
      font-family: monospace;
      font-weight: 700;
      color: var(--muted);
      min-width: 42px;
      text-align: center;
    }

    .progress-bar-container {
      flex: 1;
      display: flex;
      align-items: center;
    }

    .audio-progress {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.16);
      outline: none;
      cursor: pointer;
    }

    .audio-progress::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--cyan);
      cursor: pointer;
      box-shadow: 0 0 12px var(--cyan);
      transition: transform 0.1s ease;
    }

    .audio-progress::-webkit-slider-thumb:hover {
      transform: scale(1.3);
    }

    .audio-progress::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border: 0;
      border-radius: 50%;
      background: var(--cyan);
      cursor: pointer;
      box-shadow: 0 0 12px var(--cyan);
    }

    .audio-footer-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-top: 4px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .duration {
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 700;
    }

    .whatsapp-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 40px;
      padding: 8px 16px;
      border-radius: var(--radius);
      background: #25D366;
      color: #04140c;
      font-weight: 850;
      font-size: 0.86rem;
      text-decoration: none;
      box-shadow: 0 6px 18px rgba(37, 211, 102, 0.28);
      transition: transform 160ms ease, filter 160ms ease;
    }

    .whatsapp-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    .whatsapp-btn.full-width {
      width: 100%;
      min-height: 48px;
      font-size: 0.95rem;
    }

    .reflection-actions {
      display: grid;
      gap: 10px;
      margin: 4px 0;
    }

    .section {
      padding-top: 4px;
    }

    .section h2 {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 12px;
      color: var(--ink);
      font-size: 1.08rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .section h2 i {
      color: var(--cyan);
    }

    .story-text {
      display: grid;
      gap: 12px;
      color: #cfe0e4;
      font-size: 1rem;
      line-height: 1.68;
    }

    .story-text p {
      margin: 0;
    }

    .key-grid {
      display: grid;
      gap: 12px;
    }

    .key-card {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 12px;
      padding: 14px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.035);
    }

    .number {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      background: var(--yellow);
      color: #121004;
      font-weight: 950;
    }

    .key-copy {
      min-width: 0;
    }

    .key-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 5px;
      font-size: 1rem;
      font-weight: 900;
    }

    .key-title i {
      flex: 0 0 auto;
      color: var(--cyan);
    }

    .key-card p {
      margin: 0;
      color: #bdd1d7;
      line-height: 1.5;
      font-size: 0.94rem;
    }

    .reflection {
      display: grid;
      gap: 14px;
      padding: 16px;
      border: 1px solid rgba(255, 212, 71, 0.32);
      background: rgba(255, 212, 71, 0.075);
    }

    .question {
      margin: 0;
      font-size: 1.17rem;
      line-height: 1.35;
      font-weight: 900;
      text-wrap: balance;
    }

    .source {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.45;
    }

    .nav-actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .nav-btn {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.055);
      color: var(--ink);
    }

    .nav-btn.next {
      background: var(--cyan);
      color: #041014;
      border-color: var(--cyan);
    }

    .nav-btn:disabled {
      cursor: not-allowed;
      opacity: 0.45;
      transform: none;
      filter: none;
    }

    .list-view {
      padding: 22px 18px;
    }

    .list-head {
      display: grid;
      gap: 8px;
      margin-bottom: 18px;
    }

    .list-head h1 {
      font-size: clamp(2.2rem, 11vw, 4.9rem);
    }

    .list-head p {
      max-width: 680px;
      margin: 0;
      color: #c4d7dc;
      line-height: 1.55;
    }

    .story-list {
      display: grid;
      gap: 10px;
    }

    .story-list-item {
      display: grid;
      grid-template-columns: 130px 1fr;
      gap: 16px;
      align-items: center;
      padding: 12px 14px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.035);
      color: var(--ink);
      text-decoration: none;
      border-radius: 4px;
      transition: border-color 0.2s, background 0.2s, transform 0.2s;
    }

    .story-list-item:hover {
      border-color: var(--accent);
      background: rgba(25, 211, 230, 0.04);
      transform: translateY(-1px);
    }

    .story-list-item.locked {
      opacity: 0.52;
    }

    .story-list-thumb {
      width: 130px;
      height: 78px;
      border-radius: 3px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background-color: #0b181c;
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      flex-shrink: 0;
    }

    .story-list-info {
      display: grid;
      gap: 8px;
      min-width: 0;
    }

    .story-list-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .story-list-title {
      margin: 0;
      font-size: 1rem;
      line-height: 1.25;
      font-weight: 950;
      text-transform: uppercase;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 28px;
      padding: 5px 8px;
      background: var(--cyan-soft);
      color: var(--cyan);
      font-size: 0.76rem;
      font-weight: 900;
    }

    .lucide {
      width: 19px;
      height: 19px;
      stroke-width: 2.4;
    }

    @media (max-width: 619px) {
      .story-list-item {
        grid-template-columns: 90px 1fr;
        gap: 12px;
        padding: 10px;
      }
      .story-list-thumb {
        width: 90px;
        height: 60px;
      }
    }

    @media (min-width: 620px) {
      .page {
        padding: 26px 22px 46px;
      }

      .story-head,
      .content {
        padding: 28px;
      }

      .cover {
        min-height: 390px;
      }

      .listen-btn {
        width: auto;
        min-width: 245px;
      }

      .key-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .key-card {
        grid-template-columns: 1fr;
        align-content: start;
      }

      .nav-actions {
        grid-template-columns: 1fr 1fr;
      }

      .list-view {
        padding: 28px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar" aria-label="Encabezado de Archivo HSE">
      <div class="logo"><img src="assets/logo/focus-hse.png" alt="FOCUS HSE"></div>
      <div class="brand-kicker">ARCHIVO HSE</div>
      <nav class="top-nav" aria-label="Navegación principal">
        <a href="index.html" class="top-nav-btn" id="navTodayBtn"><i data-lucide="flame"></i><span>Historia de hoy</span></a>
        <a href="?lista=1" class="top-nav-btn" id="navListBtn"><i data-lucide="library"></i><span>Biblioteca de casos</span></a>
      </nav>
    </header>

    <article class="hero" id="storyView" aria-labelledby="storyTitle">
      <section class="story-head">
        <div class="meta">
          <span class="date-chip"><i data-lucide="calendar-days"></i><span id="storyDate"></span></span>
          <span class="file-chip"><i data-lucide="folder-open"></i><span id="storyFile"></span></span>
        </div>
        <h1 id="storyTitle"></h1>
        <p class="subtitle" id="storySubtitle"></p>
      </section>

      <section class="cover" id="coverImage" aria-label="Imagen principal de la historia">
        <div class="cover-label"><i data-lucide="flame"></i><span id="coverLabel"></span></div>
      </section>

      <div class="content">
        <section class="audio-box" aria-label="Audio de la historia">
          <div class="audio-main-row">
            <button class="listen-btn" type="button" id="listenButton">
              <i data-lucide="headphones" id="listenIcon"></i>
              <span id="listenText">Escuchar historia</span>
            </button>
            <div class="audio-controls">
              <button class="audio-ctrl-btn" type="button" id="skipBack15" title="Retroceder 15 segundos">
                <i data-lucide="rotate-ccw"></i>
              </button>
              <button class="audio-ctrl-btn" type="button" id="skipFwd15" title="Adelantar 15 segundos">
                <i data-lucide="rotate-cw"></i>
              </button>
              <button class="audio-ctrl-btn speed-btn" type="button" id="speedBtn" title="Cambiar velocidad">
                1.0x
              </button>
            </div>
          </div>
          <div class="audio-time-row">
            <span class="time-display" id="currentTime">00:00</span>
            <div class="progress-bar-container">
              <input type="range" class="audio-progress" id="audioProgress" min="0" max="100" value="0" step="0.1" aria-label="Progreso del audio">
            </div>
            <span class="time-display" id="totalDuration">--:--</span>
          </div>
          <div class="audio-footer-row">
            <span class="duration" id="audioDuration"></span>
            <a class="whatsapp-btn" id="whatsappShareAudioBtn" target="_blank" rel="noopener noreferrer" title="Compartir este caso por WhatsApp">
              <i data-lucide="share-2"></i>
              <span>Compartir en WhatsApp</span>
            </a>
          </div>
          <audio id="storyAudio" preload="metadata"></audio>
        </section>

        <section class="section" aria-labelledby="whatHappenedTitle">
          <h2 id="whatHappenedTitle"><i data-lucide="file-warning"></i>Lo que ocurrió</h2>
          <div class="story-text" id="storyBody"></div>
        </section>

        <section class="section" aria-labelledby="keyPointsTitle">
          <h2 id="keyPointsTitle"><i data-lucide="shield-check"></i>3 puntos clave para controlar el evento</h2>
          <div class="key-grid" id="keyPoints"></div>
        </section>

        <section class="reflection" aria-label="Reflexión y navegación">
          <p class="question" id="reflectionQuestion"></p>
          <p class="source" id="storySource"></p>
          <div class="reflection-actions">
            <a class="whatsapp-btn full-width" id="whatsappShareReflectionBtn" target="_blank" rel="noopener noreferrer">
              <i data-lucide="message-circle"></i>
              <span>Compartir esta lección con mi equipo en WhatsApp</span>
            </a>
          </div>
          <div class="nav-actions">
            <button class="nav-btn" type="button" id="previousStory"><i data-lucide="arrow-left"></i>Historia anterior</button>
            <button class="nav-btn next" type="button" id="nextStory">Siguiente historia<i data-lucide="arrow-right"></i></button>
          </div>
        </section>
      </div>
    </article>

    <section class="hero list-view" id="listView" hidden aria-label="Lista maestra de Archivo HSE"></section>
  </main>

  <script>
    const ZONA_HORARIA_PUBLICACION = "America/Bogota";

    // Cada historia se desbloquea a las 00:00 en horario Bogota/Quito/Lima.
    const historias = [
      {
        id: "001",
        logo: "FOCUS HSE",
        fecha: "26 JUNIO",
        fechaPublicacion: "2026-06-26",
        expediente: "Expediente #177",
        carpetaAssets: "assets/efemerides/1964-06-26-marshalls-creek/",
        titular: "UNA PEQUEÑA FUGA TERMINÓ EN DESASTRE",
        palabraResaltada: "DESASTRE",
        subtitulo: "Un accidente real que dejó una lección para toda la industria.",
        etiquetaImagen: "Marshalls Creek, Pensilvania - 1964",
        imagen: "portada.png",
        audio: "historia.m4a",
        duracionAudio: "Audio de 5 minutos 38 segundos",
        parrafos: [
          "El 26 de junio de 1964, un camión que transportaba explosivos se detuvo en la zona de Marshalls Creek, Pensilvania, luego de detectarse un incendio y señales de pérdida de control en la carga.",
          "La situación escaló con rapidez. La explosión destruyó vehículos cercanos, afectó estructuras del área y dejó víctimas fatales y heridos.",
          "La lección sigue vigente: detectar temprano, aislar sin demora y verificar los sistemas críticos puede marcar la diferencia entre una intervención segura y una tragedia."

    function resaltarTitular(texto, palabra) {
      if (!palabra || !texto.includes(palabra)) return texto;
      return texto.replace(palabra, `<span class="highlight">${palabra}</span>`);
    }

    function resolverAsset(carpeta, archivo) {
      if (!archivo) return "";
      if (archivo.startsWith("http") || archivo.includes("/")) return archivo;
      return `${carpeta}${archivo}`;
    }

    function fechaBogota() {
      const partes = new Intl.DateTimeFormat("en-US", {
        timeZone: ZONA_HORARIA_PUBLICACION,
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).formatToParts(new Date());
      const mapa = Object.fromEntries(partes.map((parte) => [parte.type, parte.value]));
      return `${mapa.year}-${mapa.month}-${mapa.day}`;
    }

    function esDisponible(historia, hoy) {
      return historia.fechaPublicacion <= hoy;
    }

    function historiaPorDefecto(hoy) {
      const disponibles = historias.filter((historia) => esDisponible(historia, hoy));
      return disponibles.at(-1) || historias[0];
    }

    function historiaSolicitada(params, hoy) {
      const id = params.get("id") || params.get("expediente");
      const fecha = params.get("fecha");
      const encontrada = historias.find((historia) => historia.id === id || historia.fechaPublicacion === fecha);
      if (encontrada && esDisponible(encontrada, hoy)) return encontrada;
      return historiaPorDefecto(hoy);
    }

    function irAHistoria(historia) {
      const url = new URL(window.location.href);
      url.search = "";
      url.searchParams.set("id", historia.id);
      window.location.href = url.toString();
    }

    function formatearTiempo(segundos) {
      if (isNaN(segundos) || segundos < 0) return "00:00";
      const min = Math.floor(segundos / 60);
      const sec = Math.floor(segundos % 60);
      return `${min.toString().padStart(2, "0")}:${sec.toString().padStart(2, "0")}`;
    }

    function actualizarTopNav(esLista) {
      const navToday = document.getElementById("navTodayBtn");
      const navList = document.getElementById("navListBtn");
      if (esLista) {
        navList?.classList.add("active");
        navToday?.classList.remove("active");
      } else {
        navToday?.classList.add("active");
        navList?.classList.remove("active");
      }
    }

    let audioInicializado = false;
    let velActualIndex = 0;
    const velocidades = [1.0, 1.25, 1.5, 2.0];

    function configurarAudio(audioRuta) {
      const audio = document.getElementById("storyAudio");
      const listenBtn = document.getElementById("listenButton");
      const listenText = document.getElementById("listenText");
      const skipBack15 = document.getElementById("skipBack15");
      const skipFwd15 = document.getElementById("skipFwd15");
      const speedBtn = document.getElementById("speedBtn");
      const currentTimeEl = document.getElementById("currentTime");
      const totalDurationEl = document.getElementById("totalDuration");
      const progressBar = document.getElementById("audioProgress");

      if (audioRuta) {
        audio.src = audioRuta;
      } else {
        audio.removeAttribute("src");
      }

      listenBtn.classList.remove("playing");
      listenText.textContent = "Escuchar historia";
      const icon = listenBtn.querySelector("i");
      if (icon) icon.setAttribute("data-lucide", "headphones");
      progressBar.value = 0;
      currentTimeEl.textContent = "00:00";
      totalDurationEl.textContent = "--:--";

      if (!audioInicializado) {
        audioInicializado = true;

        listenBtn.addEventListener("click", () => {
          if (!audio.src) {
            document.getElementById("audioDuration").textContent = "Audio en producción";
            return;
          }
          if (audio.paused) {
            audio.play();
          } else {
            audio.pause();
          }
        });

        audio.addEventListener("play", () => {
          listenBtn.classList.add("playing");
          listenText.textContent = "Pausar";
          const i = listenBtn.querySelector("i");
          if (i) i.setAttribute("data-lucide", "pause");
          lucide.createIcons();
        });

        audio.addEventListener("pause", () => {
          listenBtn.classList.remove("playing");
          listenText.textContent = "Reanudar";
          const i = listenBtn.querySelector("i");
          if (i) i.setAttribute("data-lucide", "play");
          lucide.createIcons();
        });

        audio.addEventListener("ended", () => {
          listenBtn.classList.remove("playing");
          listenText.textContent = "Volver a escuchar";
          const i = listenBtn.querySelector("i");
          if (i) i.setAttribute("data-lucide", "rotate-ccw");
          progressBar.value = 0;
          currentTimeEl.textContent = "00:00";
          lucide.createIcons();
        });

        audio.addEventListener("loadedmetadata", () => {
          totalDurationEl.textContent = formatearTiempo(audio.duration);
        });

        audio.addEventListener("durationchange", () => {
          if (audio.duration && !isNaN(audio.duration)) {
            totalDurationEl.textContent = formatearTiempo(audio.duration);
          }
        });

        let arrastrando = false;
        progressBar.addEventListener("input", () => {
          arrastrando = true;
          if (audio.duration) {
            const nuevoTiempo = (progressBar.value / 100) * audio.duration;
            currentTimeEl.textContent = formatearTiempo(nuevoTiempo);
          }
        });

        progressBar.addEventListener("change", () => {
          if (audio.duration) {
            audio.currentTime = (progressBar.value / 100) * audio.duration;
          }
          arrastrando = false;
        });

        audio.addEventListener("timeupdate", () => {
          if (!arrastrando && audio.duration) {
            progressBar.value = (audio.currentTime / audio.duration) * 100;
            currentTimeEl.textContent = formatearTiempo(audio.currentTime);
          }
        });

        skipBack15.addEventListener("click", () => {
          if (audio.currentTime !== undefined) {
            audio.currentTime = Math.max(0, audio.currentTime - 15);
          }
        });

        skipFwd15.addEventListener("click", () => {
          if (audio.duration) {
            audio.currentTime = Math.min(audio.duration, audio.currentTime + 15);
          }
        });

        speedBtn.addEventListener("click", () => {
          velActualIndex = (velActualIndex + 1) % velocidades.length;
          const nuevaVel = velocidades[velActualIndex];
          audio.playbackRate = nuevaVel;
          speedBtn.textContent = `${nuevaVel.toFixed(nuevaVel % 1 === 0 ? 1 : 2)}x`;
        });
      }
    }

    function configurarWhatsApp(historia) {
      const url = window.location.href;
      const leccion1 = historia.puntosClave && historia.puntosClave[0]
        ? `\n💡 *Punto clave:* ${historia.puntosClave[0].titulo} — ${historia.puntosClave[0].texto}`
        : "";

      const mensaje = 
`🚨 *ARCHIVO HSE | ${historia.expediente}*
📅 *${historia.fecha} — ${historia.titular}*
📍 ${historia.etiquetaImagen}

🎧 *Escucha el audio (${historia.duracionAudio}):*
${url}
${leccion1}

❓ *Para reflexionar con tu equipo:*
"${historia.pregunta}"`;

      const link = `https://api.whatsapp.com/send?text=${encodeURIComponent(mensaje)}`;
      const btnAudio = document.getElementById("whatsappShareAudioBtn");
      const btnReflex = document.getElementById("whatsappShareReflectionBtn");
      if (btnAudio) btnAudio.href = link;
      if (btnReflex) btnReflex.href = link;
    }

    function configurarNavegacion(historia, hoy) {
      const indice = historias.findIndex((item) => item.id === historia.id);
      const anterior = historias[indice - 1];
      const siguiente = historias[indice + 1];
      const botonAnterior = document.getElementById("previousStory");
      const botonSiguiente = document.getElementById("nextStory");

      botonAnterior.disabled = !anterior;
      botonAnterior.onclick = () => anterior && irAHistoria(anterior);

      const siguienteDisponible = siguiente && esDisponible(siguiente, hoy);
      botonSiguiente.disabled = !siguienteDisponible;
      botonSiguiente.onclick = () => siguienteDisponible && irAHistoria(siguiente);
    }

    function renderHistoria(historia, hoy) {
      document.getElementById("storyView").hidden = false;
      document.getElementById("listView").hidden = true;
      document.getElementById("storyDate").textContent = historia.fecha;
      document.getElementById("storyFile").textContent = historia.expediente;
      document.getElementById("storyTitle").innerHTML = resaltarTitular(historia.titular, historia.palabraResaltada);
      document.getElementById("storySubtitle").textContent = historia.subtitulo;
      document.getElementById("coverLabel").textContent = historia.etiquetaImagen;
      document.getElementById("audioDuration").textContent = historia.duracionAudio;
      document.getElementById("reflectionQuestion").textContent = historia.pregunta;
      document.getElementById("storySource").textContent = historia.fuente;

      const cover = document.getElementById("coverImage");
      const imagenRuta = resolverAsset(historia.carpetaAssets, historia.imagen);

      const aplicarCover = (url) => {
        cover.style.backgroundImage = `linear-gradient(150deg, rgba(5, 16, 20, 0.16), rgba(5, 16, 20, 0.88)), url("${url}")`;
        cover.style.backgroundPosition = "center, center";
        cover.style.backgroundSize = "cover, cover";
        cover.style.backgroundRepeat = "no-repeat, no-repeat";
        cover.style.setProperty("--cover-image", `url("${url}") center / cover`);
      };

      if (imagenRuta) {
        aplicarCover(imagenRuta);
        const testImg = new Image();
        testImg.onerror = () => {
          const fallback = historia.imagen && historia.imagen.endsWith(".jpeg")
            ? resolverAsset(historia.carpetaAssets, "portada.png")
            : resolverAsset(historia.carpetaAssets, "portada.jpeg");
          const testFallback = new Image();
          testFallback.onload = () => aplicarCover(fallback);
          testFallback.onerror = () => {
            cover.style.backgroundImage = placeholderIndustrial;
            cover.style.setProperty("--cover-image", placeholderIndustrial);
          };
          testFallback.src = fallback;
        };
        testImg.src = imagenRuta;
      } else {
        cover.style.backgroundImage = placeholderIndustrial;
        cover.style.setProperty("--cover-image", placeholderIndustrial);
      }

      const audioRuta = resolverAsset(historia.carpetaAssets, historia.audio);
      configurarAudio(audioRuta);
      configurarWhatsApp(historia);
      actualizarTopNav(false);

      document.getElementById("storyBody").innerHTML = historia.parrafos
        .map((parrafo) => `<p>${parrafo}</p>`)
        .join("");

      document.getElementById("keyPoints").innerHTML = historia.puntosClave
        .map((punto, index) => `
          <article class="key-card">
            <div class="number">${index + 1}</div>
            <div class="key-copy">
              <h3 class="key-title"><i data-lucide="${punto.icono}"></i>${punto.titulo}</h3>
              <p>${punto.texto}</p>
            </div>
          </article>
        `)
        .join("");

      configurarNavegacion(historia, hoy);
      lucide.createIcons();
    }

    function renderLista(hoy) {
      actualizarTopNav(true);
      document.getElementById("storyView").hidden = true;
      const lista = document.getElementById("listView");
      lista.hidden = false;
      lista.innerHTML = `
        <div class="list-head">
          <div class="brand-kicker">BIBLIOTECA DE CASOS</div>
          <h1>ARCHIVO HSE</h1>
          <p>Historias desbloqueadas según la fecha local de Bogotá, Quito y Lima. Las fechas futuras aparecen bloqueadas hasta su día de publicación.</p>
        </div>
        <div class="story-list">
          ${historias.map((historia) => {
            const disponible = esDisponible(historia, hoy);
            const imgRuta = resolverAsset(historia.carpetaAssets, historia.imagen);
            const thumbBg = imgRuta
              ? `background-image: linear-gradient(135deg, rgba(5, 16, 20, 0.1), rgba(5, 16, 20, 0.65)), url('${imgRuta}');`
              : `background: ${placeholderIndustrial};`;
            const contenido = `
              <div class="story-list-thumb" style="${thumbBg}"></div>
              <div class="story-list-info">
                <div class="story-list-top">
                  <span>${historia.fecha} · ${historia.expediente}</span>
                  <span class="status-pill"><i data-lucide="${disponible ? "unlock" : "lock"}"></i>${disponible ? "Disponible" : "Bloqueada"}</span>
                </div>
                <h2 class="story-list-title">${historia.titular}</h2>
              </div>
            `;
            return disponible
              ? `<a class="story-list-item" href="?id=${historia.id}">${contenido}</a>`
              : `<div class="story-list-item locked">${contenido}</div>`;
          }).join("")}
        </div>
      `;
      lucide.createIcons();
    }

    const params = new URLSearchParams(window.location.search);
    const hoy = fechaBogota();
    if (params.has("lista")) {
      renderLista(hoy);
    } else {
      renderHistoria(historiaSolicitada(params, hoy), hoy);
    }
  </script>
</body>
</html>
